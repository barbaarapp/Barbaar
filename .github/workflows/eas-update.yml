name: EAS Update (OTA Updates)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  update-eas:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest

      - name: Install Mobile Dependencies
        run: |
          cd BarbaarMobile
          npm ci || npm install --legacy-peer-deps

      - name: Verify Expo authentication
        run: |
          cd BarbaarMobile
          eas whoami || (echo "Expo token invalid or not set" && exit 1)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        run: |
          cd BarbaarMobile
          npx eas-cli update --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
